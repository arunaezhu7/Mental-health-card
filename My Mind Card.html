<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mind Card</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e8f1ef;--bg2:#e9e6f4;--ink:#2f4a4f;--soft:#5d7a7c;--sage:#8fb8a8;--mist:#a9c8dc;--lav:#c3b9e3;--sand:#f4e9d8;--card:#ffffffcc;--line:#d3e2de;--btn:#4f8a86;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16262a;--bg2:#1f2036;--ink:#e3efec;--soft:#a5bdbd;--card:#22363bcc;--line:#365055;--btn:#7fc0b6;--btnink:#10282a;--sand:#33352f}}
:root[data-theme="dark"]{--bg1:#16262a;--bg2:#1f2036;--ink:#e3efec;--soft:#a5bdbd;--card:#22363bcc;--line:#365055;--btn:#7fc0b6;--btnink:#10282a;--sand:#33352f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;line-height:1.55}
h1,h2{font-family:'Lora',Georgia,serif;font-weight:600;margin:0}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.cloud{position:absolute;opacity:.55;animation:drift 38s linear infinite}
.cloud.b{top:62%;animation-duration:55s;animation-delay:-20s;opacity:.4}
.cloud.c{top:30%;animation-duration:70s;animation-delay:-40s;opacity:.3}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
.leaf{position:absolute;width:22px;opacity:.5;animation:fall 16s ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,-10vh) rotate(0)}50%{transform:translate(30px,50vh) rotate(160deg)}100%{transform:translate(-20px,110vh) rotate(320deg)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 20px 56px}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;margin-bottom:22px}
.breath{width:150px;height:150px;margin:0 auto 6px;position:relative}
.breath .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--mist),transparent 70%);animation:breathe 8s ease-in-out infinite}
.breath svg{position:absolute;inset:25px;width:100px;height:100px;animation:float 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
.hero h1{font-size:2rem;line-height:1.2}
.hero p{color:var(--soft);margin:8px auto 0;max-width:42ch}
.tip{font-size:.85rem;color:var(--soft);margin-top:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.q label{display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:8px}
.q label svg{flex:none;width:28px;height:28px}
.q textarea,.q input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);background:transparent;resize:vertical;min-height:58px;transition:border-color .2s,box-shadow .2s}
.q textarea:focus,.q input:focus{outline:none;border-color:var(--btn);box-shadow:0 0 0 3px #4f8a8633}
.q.bad{border-color:#c58b8b}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 20px;font:700 1rem 'Nunito',sans-serif;background:var(--btn);color:var(--btnink);cursor:pointer;margin-top:16px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4f8a8640}
.btn:focus-visible,.btn.ghost:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--btn);border:2px solid var(--btn)}
#err{color:#b25d5d;text-align:center;min-height:1.4em;margin:10px 0 0;font-size:.92rem}
.card{position:relative;overflow:hidden;border-radius:28px;padding:26px 22px 22px;background:linear-gradient(165deg,#f3f8f6,#e8e4f5 60%,#f6ecdc);color:#2f4a4f;border:1px solid #fff9;box-shadow:0 20px 50px #5d7a7c30;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card .orb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;animation:float 9s ease-in-out infinite}
.card .o1{width:160px;height:160px;background:#a9c8dc;top:-40px;right:-30px}
.card .o2{width:140px;height:140px;background:#c3b9e3;bottom:-30px;left:-30px;animation-delay:-4s}
.card>*{position:relative}
.card header{text-align:center;margin-bottom:16px}
.card header svg{width:70px;height:70px;animation:float 6s ease-in-out infinite}
.card h2{font-size:1.55rem;margin-top:4px}
.card .sub{font-size:.9rem;color:#5d7a7c}
.item{display:flex;gap:12px;align-items:flex-start;background:#ffffffa6;border-radius:18px;padding:12px 14px;margin-top:10px;opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.item svg{flex:none;width:34px;height:34px;margin-top:2px}
.item small{display:block;font-size:.8rem;font-weight:700;color:#5d7a7c}
.item p{margin:2px 0 0;font-family:'Lora',Georgia,serif;font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.card footer{text-align:center;margin-top:16px;font-size:.85rem;color:#5d7a7c}
.acts{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}.item{opacity:1}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <svg class="cloud" style="top:8%" width="170" height="70" viewBox="0 0 170 70"><path d="M30 60a22 22 0 0 1 4-43 30 30 0 0 1 58-6 26 26 0 0 1 46 14 18 18 0 0 1-2 35z" fill="#fff"/></svg>
  <svg class="cloud b" width="130" height="55" viewBox="0 0 170 70"><path d="M30 60a22 22 0 0 1 4-43 30 30 0 0 1 58-6 26 26 0 0 1 46 14 18 18 0 0 1-2 35z" fill="#fff"/></svg>
  <svg class="cloud c" width="110" height="46" viewBox="0 0 170 70"><path d="M30 60a22 22 0 0 1 4-43 30 30 0 0 1 58-6 26 26 0 0 1 46 14 18 18 0 0 1-2 35z" fill="#fff"/></svg>
  <svg class="leaf" style="left:12%;animation-delay:-3s" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 20 4c0 9-5 16-16 16z" fill="#8fb8a8"/></svg>
  <svg class="leaf" style="left:46%;animation-delay:-9s;animation-duration:20s" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 20 4c0 9-5 16-16 16z" fill="#c3b9e3"/></svg>
  <svg class="leaf" style="left:80%;animation-delay:-6s;animation-duration:18s" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 20 4c0 9-5 16-16 16z" fill="#a9c8dc"/></svg>
</div>

<main>
  <section id="s1" class="screen on">
    <div class="hero">
      <div class="breath"><div class="ring"></div>
        <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#c3b9e3"><path d="M50 18c10 12 10 32 0 46-10-14-10-34 0-46z"/><path d="M50 64C36 60 24 50 20 36c14 0 26 8 30 28z" fill="#a9c8dc"/><path d="M50 64c14-4 26-14 30-28-14 0-26 8-30 28z" fill="#a9c8dc"/></g><path d="M18 70q32 14 64 0" stroke="#8fb8a8" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      </div>
      <h1>Make your mind card</h1>
      <p>Take a slow breath. Add your name, answer six small prompts, then your card appears for you to keep or share.</p>
      <p class="tip">Nothing is saved. Every visit gives you a fresh, blank start.</p>
    </div>
    <div class="q"><label for="nm"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#cfe0ee"/><circle cx="20" cy="15" r="5.5" fill="#fff" stroke="#5f93b8" stroke-width="2"/><path d="M9 31c1-6 6-9 11-9s10 3 11 9" fill="#fff" stroke="#5f93b8" stroke-width="2"/></svg><span>First, what should we call you?</span></label><input id="nm" type="text" maxlength="24" autocomplete="given-name" placeholder="Your name"></div>
    <div id="qs"></div>
    <p id="err" role="alert"></p>
    <button class="btn" id="go">Create my card</button>
  </section>

  <section id="s2" class="screen">
    <div class="card" id="card">
      <div class="orb o1"></div><div class="orb o2"></div>
      <header>
        <svg viewBox="0 0 100 100" aria-hidden="true"><g><path d="M50 14c10 12 10 32 0 46-10-14-10-34 0-46z" fill="#c3b9e3"/><path d="M50 60C36 56 24 46 20 32c14 0 26 8 30 28z" fill="#a9c8dc"/><path d="M50 60c14-4 26-14 30-28-14 0-26 8-30 28z" fill="#a9c8dc"/><path d="M16 68q34 16 68 0" stroke="#8fb8a8" stroke-width="5" fill="none" stroke-linecap="round"/></g></svg>
        <h2 id="ttl">My mind card</h2>
        <div class="sub" id="date"></div>
      </header>
      <div id="items"></div>
      <footer>Be gentle with yourself today.</footer>
    </div>
    <div class="acts">
      <button class="btn" id="again">Make a new card</button>
      <p class="tip" style="text-align:center">To share, take a screenshot of your card.</p>
    </div>
  </section>
</main>

<script>
var ICONS={
 plus:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#cfe3da"/><path d="M20 11v18M11 20h18" stroke="#4f8a86" stroke-width="3.5" stroke-linecap="round"/></svg>',
 minus:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#dcd6ef"/><path d="M12 20h16" stroke="#7a6cb3" stroke-width="3.5" stroke-linecap="round"/></svg>',
 charge:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f6e8c9"/><circle cx="20" cy="20" r="6" fill="#e6b95c"/><g stroke="#e6b95c" stroke-width="2.5" stroke-linecap="round"><path d="M20 6v4M20 30v4M6 20h4M30 20h4M10 10l3 3M27 27l3 3M30 10l-3 3M13 27l-3 3"/></g></svg>',
 talk:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#cfe0ee"/><path d="M11 13h18a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H19l-6 5v-5h-2a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" fill="#fff" stroke="#5f93b8" stroke-width="2"/><circle cx="16" cy="20" r="1.6" fill="#5f93b8"/><circle cx="20" cy="20" r="1.6" fill="#5f93b8"/><circle cx="24" cy="20" r="1.6" fill="#5f93b8"/></svg>',
 permit:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f1d9d9"/><path d="M20 30s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13z" fill="#e59a9a"/></svg>',
 strong:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#d5e8d3"/><path d="M20 8l3.5 8 8.5.8-6.4 5.6 1.9 8.4L20 26l-7.5 4.8 1.9-8.4L8 16.8l8.5-.8z" fill="#7cb27c"/></svg>'
};
var QS=[
 ['plus','Something I want more of:'],
 ['minus','Something I want less of:'],
 ['charge','Something that genuinely recharges me:'],
 ['talk','Someone I can talk to:'],
 ['permit','Something I need to give myself permission to do:'],
 ['strong','One thing I already do well:']
];
var qs=document.getElementById('qs');
function build(){
  qs.innerHTML='';
  QS.forEach(function(q,i){
    var d=document.createElement('div');d.className='q';
    d.innerHTML='<label for="q'+i+'">'+ICONS[q[0]]+'<span>'+q[1]+'</span></label><textarea id="q'+i+'" maxlength="160" rows="2"></textarea>';
    qs.appendChild(d);
  });
}
function show(id){
  document.getElementById('s1').classList.toggle('on',id==='s1');
  document.getElementById('s2').classList.toggle('on',id==='s2');
  window.scrollTo(0,0);
}
document.getElementById('go').onclick=function(){
  var vals=[],bad=false,nm=document.getElementById('nm').value.trim();
  QS.forEach(function(q,i){
    var t=document.getElementById('q'+i),v=t.value.trim();
    t.parentNode.parentNode.classList.toggle('bad',!v);
    if(!v)bad=true;vals.push(v);
  });
  var err=document.getElementById('err');
  if(bad){err.textContent='Please fill in all six prompts to create your card.';return;}
  err.textContent='';
  var box=document.getElementById('items');box.innerHTML='';
  QS.forEach(function(q,i){
    var el=document.createElement('div');el.className='item';
    el.style.animationDelay=(0.5+i*0.35)+'s';
    el.innerHTML=ICONS[q[0]]+'<div><small></small><p></p></div>';
    el.querySelector('small').textContent=q[1].replace(/:$/,'');
    el.querySelector('p').textContent=vals[i];
    box.appendChild(el);
  });
  document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('ttl').textContent=nm?(nm+(/s$/i.test(nm)?"'":"'s")+' mind card'):'My mind card';
  var c=document.getElementById('card');c.style.animation='none';void c.offsetWidth;c.style.animation='';
  show('s2');
};
document.getElementById('again').onclick=function(){document.getElementById('nm').value='';build();show('s1');};
build();
</script>
</body>
</html>
